name: Push - Test & Deploy (Fingerprint → OTA or Build)

on:
  push:
    branches:
      - develop

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  # Yarn 4: allow installs in CI (avoids immutable lockfile failures)
  YARN_ENABLE_IMMUTABLE_INSTALLS: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup Yarn (Corepack)
        run: corepack enable && corepack prepare yarn@4.5.0 --activate

      - name: Install dependencies
        working-directory: testapp
        run: yarn install

      - name: Run tests
        working-directory: testapp
        run: yarn test

  deploy:
    name: Deploy (OTA)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup Yarn (Corepack)
        run: corepack enable && corepack prepare yarn@4.5.0 --activate

      - name: Install dependencies
        working-directory: testapp
        run: yarn install

      - name: Setup EAS
        uses: expo/expo-github-action@main  # @v8 uses deprecated cache API (causes 400)
        with:
          eas-version: latest
          eas-cache: false  # Workaround if cache issues persist
          packager: npm  # Avoid yarn failures in CI (expo action uses yarn by default)
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish EAS Update (OTA)
        working-directory: testapp
        run: eas update --branch development --message "Deploy from CI (${{ github.sha }})" --non-interactive
        continue-on-error: true
